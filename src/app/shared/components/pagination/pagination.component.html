<!-- spacer keeps the same space in normal flow as the fixed bar occupies -->
<div *ngIf="totalPages > 0" style="height: 52px;"></div>

<div *ngIf="totalPages > 0" class="d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2 px-3 py-2 border-top" style="position: fixed; bottom: 0; left: 0; right: 0; z-index: 999; background: var(--bs-body-bg, #fff); box-shadow: 0 -2px 6px rgba(0,0,0,.08);">
  <small class="text-muted">Seite {{ currentPage + 1 }} von {{ totalPages }} &middot; {{ totalElements }} Einträge</small>
  <nav *ngIf="totalPages > 1">
    <ul class="pagination pagination-sm mb-0">
      <li class="page-item" [class.disabled]="currentPage === 0">
        <button class="page-link" (click)="pageChange.emit(currentPage - 1)" [disabled]="currentPage === 0">&#8249;</button>
      </li>
      <li *ngFor="let p of getPageNumbers()" class="page-item" [class.active]="p === currentPage">
        <button class="page-link" (click)="pageChange.emit(p)">{{ p + 1 }}</button>
      </li>
      <li class="page-item" [class.disabled]="currentPage >= totalPages - 1">
        <button class="page-link" (click)="pageChange.emit(currentPage + 1)" [disabled]="currentPage >= totalPages - 1">&#8250;</button>
      </li>
    </ul>
  </nav>
  <select class="form-select form-select-sm" [ngModel]="pageSize" (ngModelChange)="onPageSizeChange($event)" style="width:auto">
    <option [ngValue]="10">10 / Seite</option>
    <option [ngValue]="20">20 / Seite</option>
    <option [ngValue]="50">50 / Seite</option>
    <option [ngValue]="100">100 / Seite</option>
  </select>
</div>

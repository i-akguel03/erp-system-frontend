<!-- Spinner -->
<div *ngIf="loading" class="d-flex justify-content-center my-3">
  <div class="spinner-border text-primary" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
</div>

<!-- Fehlermeldung -->
<div *ngIf="error" class="alert alert-danger">
  {{ error }}
</div>

<div class="d-flex justify-content-between align-items-center mb-3">
  <!-- Suchfeld -->
  <input type="text" class="form-control me-2" style="max-width: 300px;" placeholder="Kunden suchen..." 
         [(ngModel)]="searchTerm" (ngModelChange)="filterCustomers()">

  <div class="d-flex gap-2">
    <button class="btn btn-secondary btn-sm" (click)="generateTestData()">Testdaten erzeugen</button>
    <button class="btn btn-primary btn-sm" (click)="openNewModal()">Neuer Kunde</button>
  </div>
</div>


<!-- Kundenliste -->
<!-- Kundenliste -->
<div class="table-responsive mb-3"> <!-- ✅ table-responsive Wrapper -->
  <table class="table table-striped table-hover mb-0">
    <thead>
      <tr>
        <th>Kundennummer</th>
        <th>Vorname</th>
        <th>Name</th>
        <th>Telefon</th>
        <th>Wohnadresse</th>
        <th>Aktionen</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let customer of filteredCustomers">
        <td>{{ customer.customerNumber }}</td>
        <td>{{ customer.firstName }}</td>
        <td>{{ customer.lastName }}</td>
        <td>{{ customer.tel }}</td>
        <td>{{ customer.residentialAddressId }}</td>
        <td>
          <button class="btn btn-warning btn-sm me-2" (click)="openEditModal(customer)">Bearbeiten</button>
          <button class="btn btn-danger btn-sm" (click)="deleteCustomer(customer.id)">Löschen</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>


<!-- Modal Neuer Kunde -->
<div *ngIf="showNewModal">
  <div class="modal-backdrop fade show"></div>
  <div class="modal d-block">
    <div class="modal-dialog">
      <div class="modal-content">
        <form (ngSubmit)="createCustomer()" #newForm="ngForm">
          <div class="modal-header">
            <h5 class="modal-title">Neuer Kunde</h5>
            <button type="button" class="btn-close" (click)="closeNewModal()"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label">Kundennummer</label>
              <input type="text" class="form-control" [(ngModel)]="newCustomer.customerNumber" name="customerNumber" readonly>
            </div>
            <div class="mb-3">
              <label class="form-label">Vorname</label>
              <input type="text" class="form-control" [(ngModel)]="newCustomer.firstName" name="firstName" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Nachname</label>
              <input type="text" class="form-control" [(ngModel)]="newCustomer.lastName" name="lastName" required>
            </div>
            <div class="mb-3">
              <label class="form-label">E-Mail</label>
              <input type="email" class="form-control" [(ngModel)]="newCustomer.email" name="email">
            </div>
            <div class="mb-3">
              <label class="form-label">Telefon</label>
              <input type="text" class="form-control" [(ngModel)]="newCustomer.tel" name="tel">
            </div>
            <div class="mb-3">
              <label class="form-label">Wohnadresse</label>
              <input type="text" class="form-control" [(ngModel)]="newCustomer.residentialAddressId" name="residentialAddressId">
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" (click)="closeNewModal()">Abbrechen</button>
            <button type="submit" class="btn btn-success" [disabled]="!newForm.form.valid">Speichern</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Modal Bearbeiten Kunde -->
<div *ngIf="showEditModal">
  <div class="modal-backdrop fade show"></div>
  <div class="modal d-block">
    <div class="modal-dialog">
      <div class="modal-content">
        <form (ngSubmit)="updateCustomer()" #editForm="ngForm">
          <div class="modal-header">
            <h5 class="modal-title">Kunde bearbeiten</h5>
            <button type="button" class="btn-close" (click)="closeEditModal()"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label">Kundennummer</label>
              <input type="text" class="form-control" [(ngModel)]="editCustomer.customerNumber" name="editCustomerNumber" readonly>
            </div>
            <div class="mb-3">
              <label class="form-label">Vorname</label>
              <input type="text" class="form-control" [(ngModel)]="editCustomer.firstName" name="editFirstName" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Nachname</label>
              <input type="text" class="form-control" [(ngModel)]="editCustomer.lastName" name="editLastName" required>
            </div>
            <div class="mb-3">
              <label class="form-label">E-Mail</label>
              <input type="email" class="form-control" [(ngModel)]="editCustomer.email" name="editEmail">
            </div>
            <div class="mb-3">
              <label class="form-label">Telefon</label>
              <input type="text" class="form-control" [(ngModel)]="editCustomer.tel" name="editTel">
            </div>
            <div class="mb-3">
              <label class="form-label">Wohnadresse</label>
              <input type="text" class="form-control" [(ngModel)]="editCustomer.residentialAddressId" name="editResidentialAddressId">
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" (click)="closeEditModal()">Abbrechen</button>
            <button type="submit" class="btn btn-success" [disabled]="!editForm.form.valid">Speichern</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

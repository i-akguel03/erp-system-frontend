<div class="p-3 p-md-4">

  <!-- Header -->
  <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2">
    <div>
      <h4 class="mb-0 fw-bold">
        <i class="bi bi-bell me-2 text-primary"></i>Benachrichtigungen
      </h4>
      <small class="text-muted">{{ totalElements }} gesamt
        <span *ngIf="unreadCount > 0" class="ms-2 badge bg-primary rounded-pill">{{ unreadCount }} ungelesen</span>
      </small>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-outline-secondary btn-sm" (click)="load()" [disabled]="loading" title="Neu laden">
        <i class="bi bi-arrow-clockwise"></i>
      </button>
      <button class="btn btn-outline-primary btn-sm"
              (click)="markAllRead()"
              [disabled]="markingAll || unreadCount === 0">
        <i class="bi bi-check2-all me-1"></i>Alle gelesen
      </button>
    </div>
  </div>

  <!-- Error -->
  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <!-- Loading -->
  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status"></div>
    <p class="mt-2 text-muted">Wird geladen...</p>
  </div>

  <!-- Liste -->
  <div *ngIf="!loading">

    <div *ngIf="items.length === 0" class="text-center py-5 text-muted">
      <i class="bi bi-bell-slash display-4 d-block mb-3 opacity-50"></i>
      Keine Benachrichtigungen vorhanden
    </div>

    <div *ngFor="let n of items; trackBy: trackById"
         class="card mb-2 border-0 shadow-sm border-start border-3 position-relative"
         [ngClass]="[severityBg(n.severity), n.read ? 'opacity-75' : '']"
         style="cursor:pointer;"
         (click)="markAsRead(n)">

      <!-- Ungelesen-Indikator -->
      <div *ngIf="!n.read"
           class="position-absolute top-0 end-0 mt-2 me-2">
        <span class="badge bg-primary rounded-pill" style="font-size:0.6rem;">NEU</span>
      </div>

      <div class="card-body p-3">
        <div class="d-flex gap-3 align-items-start">

          <!-- Icon -->
          <div class="flex-shrink-0 mt-1">
            <i class="bi fs-5" [ngClass]="severityIcon(n.severity)"></i>
          </div>

          <!-- Content -->
          <div class="flex-grow-1 min-width-0">
            <div class="d-flex justify-content-between align-items-start gap-2">
              <div class="fw-semibold" [class.fw-bold]="!n.read">{{ n.title }}</div>
              <small class="text-muted flex-shrink-0">
                {{ n.createdAt | date:'dd.MM.yy HH:mm' }}
              </small>
            </div>
            <div class="text-muted small mt-1">{{ n.message }}</div>
            <div *ngIf="n.entityType" class="mt-1">
              <span class="badge bg-light text-secondary border" style="font-size:0.7rem;">
                <i class="bi bi-tag me-1"></i>{{ n.entityType }}
                <span *ngIf="n.entityId" class="ms-1 opacity-75">· {{ n.entityId }}</span>
              </span>
            </div>
          </div>

          <!-- Löschen -->
          <button class="btn btn-outline-danger btn-sm flex-shrink-0"
                  style="padding:2px 6px;"
                  (click)="delete(n, $event)"
                  title="Löschen">
            <i class="bi bi-trash" style="font-size:0.75rem;"></i>
          </button>

        </div>
      </div>
    </div>

    <!-- Pagination -->
    <div *ngIf="totalPages > 1" class="d-flex justify-content-between align-items-center mt-3">
      <small class="text-muted">Seite {{ page + 1 }} von {{ totalPages }}</small>
      <div class="d-flex gap-1">
        <button class="btn btn-outline-secondary btn-sm" (click)="goToPage(0)" [disabled]="page === 0">
          <i class="bi bi-chevron-double-left"></i>
        </button>
        <button class="btn btn-outline-secondary btn-sm" (click)="goToPage(page - 1)" [disabled]="page === 0">
          <i class="bi bi-chevron-left"></i>
        </button>
        <ng-container *ngFor="let p of pages">
          <button *ngIf="p >= page - 2 && p <= page + 2"
                  class="btn btn-sm"
                  [class.btn-primary]="p === page"
                  [class.btn-outline-secondary]="p !== page"
                  (click)="goToPage(p)">
            {{ p + 1 }}
          </button>
        </ng-container>
        <button class="btn btn-outline-secondary btn-sm" (click)="goToPage(page + 1)" [disabled]="page >= totalPages - 1">
          <i class="bi bi-chevron-right"></i>
        </button>
        <button class="btn btn-outline-secondary btn-sm" (click)="goToPage(totalPages - 1)" [disabled]="page >= totalPages - 1">
          <i class="bi bi-chevron-double-right"></i>
        </button>
      </div>
    </div>

  </div>
</div>

<nav *ngIf="showNavbar" class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
  <div class="container-fluid">

    <!-- Brand/Logo -->
    <a class="navbar-brand" routerLink="/dashboard" (click)="closeNavbar(); closeAllDropdowns()">
      <i class="bi bi-building me-2"></i>
      <span class="brand-text">ERP System</span>
    </a>

    <!-- Toggle Button für Mobile -->
    <button
      class="navbar-toggler border-0"
      type="button"
      (click)="toggleNavbar()"
      [attr.aria-expanded]="!isCollapsed"
      [attr.aria-label]="isCollapsed ? 'Navigation öffnen' : 'Navigation schließen'">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Navbar Content -->
    <div class="navbar-collapse" [class.collapse]="isCollapsed" [class.show]="!isCollapsed">

      <!-- Navigation Links - immer sichtbar, disabled wenn nicht eingeloggt -->
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">

        <li class="nav-item" *ngFor="let item of items; trackBy: trackByFn">

          <!-- Normaler Link (kein Dropdown) -->
          <a *ngIf="!item.children"
            class="nav-link"
            [class.disabled]="!isLoggedIn()"
            [routerLink]="isLoggedIn() ? item.routerLink : null"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: false }"
            (click)="isLoggedIn() && navigateAndClose(item.routerLink)"
            [attr.aria-label]="item.label"
            [attr.aria-disabled]="!isLoggedIn()">
            <i [class]="'bi ' + item.icon + ' me-2'"></i>
            <span>{{ item.label }}</span>
          </a>

          <!-- Dropdown -->
          <div *ngIf="item.children" class="nav-item dropdown">
            <a class="nav-link dropdown-toggle-custom"
              [class.disabled]="!isLoggedIn()"
              role="button"
              (click)="isLoggedIn() && toggleNavDropdown(item.label)"
              [class.active]="isLoggedIn() && isNavDropdownOpen(item.label)"
              [class.show]="isLoggedIn() && isNavDropdownOpen(item.label)"
              [attr.aria-expanded]="isLoggedIn() && isNavDropdownOpen(item.label)"
              [attr.aria-disabled]="!isLoggedIn()"
              style="cursor: pointer;">
              <span class="nav-content">
                <i [class]="'bi ' + item.icon + ' me-2'"></i>
                <span>{{ item.label }}</span>
              </span>
              <i class="bi bi-chevron-down dropdown-arrow"
                [class.rotated]="isLoggedIn() && isNavDropdownOpen(item.label)"></i>
            </a>

            <ul class="dropdown-menu"
              [class.show]="isLoggedIn() && isNavDropdownOpen(item.label)"
              [attr.aria-hidden]="!isLoggedIn() || !isNavDropdownOpen(item.label)">
              <li *ngFor="let child of item.children; trackBy: trackByChildFn">
                <a class="dropdown-item"
                  [routerLink]="child.routerLink"
                  routerLinkActive="active"
                  (click)="navigateAndClose(child.routerLink)"
                  [attr.aria-label]="child.label">
                  <i [class]="'bi ' + child.icon + ' me-2'"></i>
                  <span>{{ child.label }}</span>
                </a>
              </li>
            </ul>
          </div>
        </li>
      </ul>

      <!-- Rechts: User-Dropdown wenn eingeloggt, sonst Anmelden-Button -->
      <div class="navbar-nav ms-auto">

        <!-- Eingeloggt: User-Dropdown -->
        <div class="nav-item dropdown user-dropdown" *ngIf="isLoggedIn()">
          <a
            class="nav-link dropdown-toggle-custom user-link"
            (click)="toggleDropdown()"
            [class.active]="isDropdownOpen"
            [class.show]="isDropdownOpen"
            [attr.aria-expanded]="isDropdownOpen"
            style="cursor: pointer;">
            <span class="nav-content">
              <i class="bi bi-person-circle me-2"></i>
              <span class="user-name">{{ currentUser || 'Benutzer' }}</span>
            </span>
            <i class="bi bi-chevron-down dropdown-arrow" [class.rotated]="isDropdownOpen"></i>
          </a>

          <ul class="dropdown-menu dropdown-menu-end"
            [class.show]="isDropdownOpen"
            [attr.aria-hidden]="!isDropdownOpen">
            <li>
              <span class="dropdown-item-text px-3 py-2 text-muted small border-bottom">
                <i class="bi bi-person-badge me-2"></i>
                Angemeldet als: {{ currentUser || 'Benutzer' }}
              </span>
            </li>
            <li>
              <a class="dropdown-item logout-item"
                (click)="logout()"
                style="cursor: pointer;">
                <i class="bi bi-box-arrow-right me-2"></i>
                <span>Abmelden</span>
              </a>
            </li>
          </ul>
        </div>

        <!-- Nicht eingeloggt: Anmelden-Button -->
        <div class="nav-item" *ngIf="!isLoggedIn()">
          <a class="nav-link btn btn-outline-light btn-sm px-3 ms-lg-2"
            routerLink="/login"
            (click)="closeNavbar()"
            style="font-weight: 500;">
            <i class="bi bi-box-arrow-in-right me-1"></i>
            Anmelden
          </a>
        </div>

      </div>
    </div>
  </div>
</nav>

<!-- Mobile Overlay -->
<div class="navbar-overlay"
  [class.show]="!isCollapsed"
  (click)="closeNavbar()"
  *ngIf="showNavbar && !isCollapsed">
</div>

<!-- Spacer für fixed navbar -->
<div class="navbar-spacer" *ngIf="showNavbar"></div>

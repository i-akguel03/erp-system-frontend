<app-list-toolbar
  [(searchTerm)]="searchTerm"
  placeholder="Straße, Stadt oder PLZ suchen..."
  newLabel="Neue Adresse"
  (search)="filterAddresses()"
  (refresh)="loadAddresses()"
  (newClick)="openNewModal()">
</app-list-toolbar>

<!-- Inhalt -->
<div class="list-content px-3 px-md-4 py-2 d-flex flex-column flex-fill overflow-hidden">

  <app-list-status [loading]="loading" [error]="error" (dismiss)="clearError()"></app-list-status>

  <!-- Desktop Tabelle -->
  <div class="table-responsive d-none d-md-block" style="flex: 1 1 0; overflow-y: auto; min-height: 0;" *ngIf="filteredAddresses.length > 0 && !loading">
    <table class="table table-hover align-middle mb-0">
      <thead>
        <tr class="border-bottom border-2">
          <th class="fw-semibold text-muted text-uppercase border-0" style="font-size: 0.7rem; letter-spacing: 0.05em; cursor: pointer; user-select: none;" (click)="sort.toggle('street')">Straße <i class="fas ms-1" [ngClass]="sort.icon('street')" style="font-size: 0.55rem;"></i></th>
          <th class="fw-semibold text-muted text-uppercase border-0" style="font-size: 0.7rem; letter-spacing: 0.05em; cursor: pointer; user-select: none;" (click)="sort.toggle('postalCode')">PLZ <i class="fas ms-1" [ngClass]="sort.icon('postalCode')" style="font-size: 0.55rem;"></i></th>
          <th class="fw-semibold text-muted text-uppercase border-0" style="font-size: 0.7rem; letter-spacing: 0.05em; cursor: pointer; user-select: none;" (click)="sort.toggle('city')">Stadt <i class="fas ms-1" [ngClass]="sort.icon('city')" style="font-size: 0.55rem;"></i></th>
          <th class="fw-semibold text-muted text-uppercase border-0" style="font-size: 0.7rem; letter-spacing: 0.05em; cursor: pointer; user-select: none;" (click)="sort.toggle('country')">Land <i class="fas ms-1" [ngClass]="sort.icon('country')" style="font-size: 0.55rem;"></i></th>
          <th class="border-0" style="width: 80px;"></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let address of filteredAddresses | sort:sort.key:sort.dir">
          <td class="fw-medium">{{ address.street }}</td>
          <td class="text-muted small">{{ address.postalCode }}</td>
          <td class="text-muted small">{{ address.city }}</td>
          <td class="text-muted small">{{ address.country }}</td>
          <td>
            <div class="d-flex gap-1 justify-content-end">
              <button class="btn btn-sm btn-outline-primary" (click)="openEditModal(address)" title="Bearbeiten">
                <i class="fas fa-edit"></i>
              </button>
              <button class="btn btn-sm btn-outline-danger" (click)="deleteAddress(address.id)" title="Löschen">
                <i class="fas fa-trash"></i>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Mobile Cards -->
  <div class="d-md-none" style="flex: 1 1 0; overflow-y: auto; min-height: 0;" *ngIf="!loading">
    <div *ngFor="let address of filteredAddresses" class="card border-0 shadow-sm mb-3">
      <div class="card-body">
        <div class="fw-semibold mb-1">{{ address.street }}</div>
        <div class="text-muted small mb-3">
          {{ address.postalCode }} {{ address.city }}, {{ address.country }}
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-sm btn-outline-primary flex-grow-1" (click)="openEditModal(address)">
            <i class="fas fa-edit me-1"></i>Bearbeiten
          </button>
          <button class="btn btn-sm btn-outline-danger" (click)="deleteAddress(address.id)" title="Löschen">
            <i class="fas fa-trash"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Leerzustand -->
  <div *ngIf="filteredAddresses.length === 0 && !loading" class="d-flex flex-column align-items-center justify-content-center py-5 text-muted">
    <i class="fas fa-map-marker-alt fa-3x mb-3 opacity-25"></i>
    <h6 class="mb-1">Keine Adressen gefunden</h6>
    <small>Versuchen Sie andere Suchbegriffe oder erstellen Sie eine neue Adresse.</small>
  </div>

</div>

<app-pagination
  [currentPage]="currentPage"
  [totalPages]="totalPages"
  [totalElements]="totalElements"
  [pageSize]="pageSize"
  (pageChange)="goToPage($event)"
  (pageSizeChange)="pageSize=$event; onPageSizeChange()">
</app-pagination>

<!-- Neue Adresse Dialog -->
<p-dialog
  header="Neue Adresse erstellen"
  [(visible)]="showNewModal"
  [modal]="true"
  [draggable]="true"
  [resizable]="false"
  [style]="{ width: '420px', maxWidth: '95vw' }"
  (onHide)="closeNewModal()">
  <div class="d-flex flex-column gap-2 py-2">
    <div class="form-floating">
      <input type="text" class="form-control" id="nAdrStreet" placeholder=" " [(ngModel)]="newAddress.street">
      <label for="nAdrStreet">Straße</label>
    </div>
    <div class="row g-2">
      <div class="col-4">
        <div class="form-floating">
          <input type="text" class="form-control" id="nAdrPlz" placeholder=" " [(ngModel)]="newAddress.postalCode">
          <label for="nAdrPlz">PLZ</label>
        </div>
      </div>
      <div class="col-8">
        <div class="form-floating">
          <input type="text" class="form-control" id="nAdrCity" placeholder=" " [(ngModel)]="newAddress.city">
          <label for="nAdrCity">Stadt</label>
        </div>
      </div>
    </div>
    <div class="form-floating">
      <input type="text" class="form-control" id="nAdrCountry" placeholder=" " [(ngModel)]="newAddress.country">
      <label for="nAdrCountry">Land</label>
    </div>
    <div class="d-flex gap-2 justify-content-end pt-2 border-top mt-1">
      <button class="btn btn-outline-secondary" (click)="closeNewModal()">Abbrechen</button>
      <button class="btn btn-primary" (click)="createAddress()" [disabled]="saving">
        @if (saving) { <span class="spinner-border spinner-border-sm me-1"></span> }Erstellen
      </button>
    </div>
  </div>
</p-dialog>

<!-- Adresse Bearbeiten Dialog -->
<p-dialog
  header="Adresse bearbeiten"
  [(visible)]="showEditModal"
  [modal]="true"
  [draggable]="true"
  [resizable]="false"
  [style]="{ width: '420px', maxWidth: '95vw' }"
  (onHide)="closeEditModal()">
  <div class="d-flex flex-column gap-2 py-2">
    <div class="form-floating">
      <input type="text" class="form-control" id="eAdrStreet" placeholder=" " [(ngModel)]="editAddress.street">
      <label for="eAdrStreet">Straße</label>
    </div>
    <div class="row g-2">
      <div class="col-4">
        <div class="form-floating">
          <input type="text" class="form-control" id="eAdrPlz" placeholder=" " [(ngModel)]="editAddress.postalCode">
          <label for="eAdrPlz">PLZ</label>
        </div>
      </div>
      <div class="col-8">
        <div class="form-floating">
          <input type="text" class="form-control" id="eAdrCity" placeholder=" " [(ngModel)]="editAddress.city">
          <label for="eAdrCity">Stadt</label>
        </div>
      </div>
    </div>
    <div class="form-floating">
      <input type="text" class="form-control" id="eAdrCountry" placeholder=" " [(ngModel)]="editAddress.country">
      <label for="eAdrCountry">Land</label>
    </div>
    <div class="d-flex gap-2 justify-content-end pt-2 border-top mt-1">
      <button class="btn btn-outline-secondary" (click)="closeEditModal()">Abbrechen</button>
      <button class="btn btn-primary" (click)="updateAddress()" [disabled]="saving">
        @if (saving) { <span class="spinner-border spinner-border-sm me-1"></span> }Speichern
      </button>
    </div>
  </div>
</p-dialog>

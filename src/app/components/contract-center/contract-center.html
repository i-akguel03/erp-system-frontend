<div class="contract-center-container">

  <!-- Obere Vertragsliste (70%) -->
  <div class="contracts-top">
    <input type="text"
           placeholder="Vertrag suchen..."
           [(ngModel)]="searchTerm"
           (input)="filterContracts()"
           class="form-control mb-2">
    <ul class="list-group">
      <li *ngFor="let contract of filteredContracts"
          (click)="selectContract(contract)"
          [class.selected]="isSelected(contract)"
          class="list-group-item list-group-item-action">
        {{ contract.contractTitle }} ({{ contract.contractNumber }})
      </li>
    </ul>
  </div>

  <!-- Untere Panels (30%) -->
  <div class="contracts-bottom">
    <!-- Links: Abos -->
    <div class="subscriptions-panel">
      <h5>Abonnements von {{ selectedContract?.contractTitle || '...' }}</h5>
      <ul class="list-group">
        <li *ngFor="let sub of subscriptions" class="list-group-item">
          {{ sub.productName }} – {{ sub.subscriptionNumber }}
        </li>
        <li *ngIf="subscriptions.length === 0" class="list-group-item text-muted">
          Keine Abonnements vorhanden
        </li>
      </ul>
    </div>

    <!-- Rechts: Details / Filter -->
    <div class="details-panel">
      <h5>Details / Filter</h5>
      <ul class="list-group">
        <li class="list-group-item text-muted">Keine Daten ausgewählt</li>
      </ul>
    </div>
  </div>
</div>

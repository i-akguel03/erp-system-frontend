    <div>
      <i class="fas fa-euro-sign me-2"></i>
      Finanzdetails {{ selectedContract ? 'von ' + selectedContract.contractTitle : '' }}
    </div>
    <div *ngIf="selectedSubscription">
      <small class="text-muted">Subscription: {{ selectedSubscription.subscriptionNumber }}</small>
      <button class="btn btn-sm btn-outline-secondary ms-2" (click)="refreshData()" [disabled]="isLoading">
        <i class="fas fa-refresh" [class.fa-spin]="isLoading"></i>
      </button>
    </div>
  </div> -->

  <!-- Tab Navigation -->
  <ul class="nav nav-tabs nav-fill" role="tablist">
    <li class="nav-item">
      <button class="nav-link" [class.active]="activeTab==='schedule'" (click)="setActiveTab('schedule')">
        <i class="fas fa-calendar-alt me-1"></i> Fälligkeitsplan
      </button>
    </li>
    <li class="nav-item">
      <button class="nav-link" [class.active]="activeTab==='invoices'" (click)="setActiveTab('invoices')">
        <i class="fas fa-file-invoice me-1"></i> Rechnungen
      </button>
    </li>
    <li class="nav-item">
      <button class="nav-link" [class.active]="activeTab==='openitems'" (click)="setActiveTab('openitems')">
        <i class="fas fa-exclamation-triangle me-1"></i> Offene Posten
      </button>
    </li>
  </ul>

  <!-- Tab Content -->
  <div class="card-body p-0 flex-fill">
    <div class="tab-content h-100">

      <!-- Fälligkeitsplan -->
      <div class="tab-pane h-100" [class.active]="activeTab==='schedule'">
        <div class="scrollable">
          <app-due-schedule-tab [dueSchedules]="dueSchedules"></app-due-schedule-tab>
        </div>
      </div>

      <!-- Rechnungen -->
      <div class="tab-pane h-100" [class.active]="activeTab==='invoices'">
        <div class="scrollable">
          <app-invoice-tab
            [invoices]="invoices"
            [customers]="customers"
            (invoiceAction)="onInvoiceAction($event)">
          </app-invoice-tab>
        </div>
      </div>

      <!-- Offene Posten -->
      <div class="tab-pane h-100" [class.active]="activeTab==='openitems'">
        <div class="scrollable">
          <app-open-items-tab
            [openItems]="openItems"
            [customers]="customers"
            [selectedSubscriptionId]="selectedSubscription?.id || null"
            (openItemAction)="onOpenItemAction($event)">
          </app-open-items-tab>
        </div>
      </div>

    </div>
  </div>

</div>

<p-toast position="top-right"></p-toast>
<p-confirmDialog></p-confirmDialog>
<app-backend-check *ngIf="!backendReady()" (backendStatus)="backendReady.set($event)"></app-backend-check>

<div *ngIf="backendReady()" class="app-root-container d-flex flex-column vh-100">

  <!-- Navbar oben, sticky -->
  <app-navbar *ngIf="auth.authStatus$ | async"></app-navbar>

  <!-- Main Content Bereich: fill the rest of the viewport -->
  <div class="app-main-wrapper flex-fill d-flex flex-column overflow-hidden">
    <div class="app-main-container flex-fill overflow-auto">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>

<!-- Backend-Check Overlay nur anzeigen, solange Backend nicht bereit -->
<app-backend-check *ngIf="!backendReady()" (backendStatus)="backendReady.set($event)"></app-backend-check>

<!-- App-Inhalt erst anzeigen, wenn Backend bereit ist -->
<div *ngIf="backendReady()" class="app-root-container">
  
  <!-- Navbar oben -->
<app-navbar *ngIf="auth.authStatus$ | async"></app-navbar>

  <!-- Main Content Bereich -->
  <div class="app-main-wrapper">
    <div class="app-main-container">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-4">
      <div class="card shadow-sm">
        <div class="card-body">
          
          <!-- ✅ Registrierungsformular (nur anzeigen wenn noch nicht registriert) -->
          <div *ngIf="!isRegistered">
            <h3 class="card-title text-center mb-4">Registrieren</h3>
            
            <form (ngSubmit)="register()">
              <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" class="form-control" 
                       [(ngModel)]="username" name="username" required>
              </div>
              
              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" class="form-control" 
                       [(ngModel)]="password" name="password" required>
              </div>
              
              <button type="submit" class="btn btn-primary w-100">Registrieren</button>
            </form>
            
            <!-- Fehlermeldung -->
            <div *ngIf="error" class="alert alert-danger mt-3">{{ error }}</div>
          </div>
          
          <!-- ✅ Erfolgsmeldung (nur anzeigen nach erfolgreicher Registrierung) -->
          <div *ngIf="isRegistered" class="text-center">
            <div class="mb-4">
              <i class="fas fa-check-circle text-success" style="font-size: 4rem;"></i>
            </div>
            
            <h3 class="card-title text-success mb-3">Registrierung erfolgreich!</h3>
            
            <div class="alert alert-success mb-4">
              <strong>Willkommen!</strong><br>
              Ihr Account wurde erfolgreich erstellt. Sie können sich jetzt anmelden.
            </div>
            
            <!-- ✅ Button zum Anmelden -->
            <button type="button" class="btn btn-primary w-100" (click)="goToLogin()">
              Zum Anmelden
            </button>
          </div>
          
        </div>
      </div>
      
      <!-- ✅ Link zum Login (immer sichtbar am unteren Rand) -->
      <div class="text-center mt-3" *ngIf="!isRegistered">
        <p class="text-muted">Bereits ein Account vorhanden?</p>
        <a routerLink="/login" class="btn btn-outline-primary">Zum Anmelden</a>
      </div>
      
    </div>
  </div>
</div>
